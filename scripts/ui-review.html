<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Cloud Plan · 本机 UI 对照</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#e8edf4;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:#10213d}header{position:sticky;top:0;z-index:10;padding:12px 20px;background:#fff;border-bottom:1px solid #c9d8ed;display:flex;gap:12px;align-items:center;flex-wrap:wrap}strong{margin-right:8px}select,button,a{font:inherit;padding:8px 12px;border:1px solid #bbcde5;border-radius:5px;background:#fff;color:inherit;text-decoration:none}button[aria-pressed=true]{background:#0866ff;color:#fff;border-color:#0866ff}label{display:flex;gap:8px;align-items:center}.note{margin-left:auto;color:#58708f;font-size:12px}main{padding:18px;overflow:hidden}.frame{position:relative;background:#fff;margin:auto;box-shadow:0 4px 20px #172b4d10;transform-origin:top left}.frame iframe{border:0;width:1440px;height:1100px;display:block}.frame img{position:absolute;top:0;left:0;width:1440px;pointer-events:none;display:none}.frame.concept iframe{visibility:hidden}.frame.concept img,.frame.overlay img{display:block}.frame.overlay img{opacity:var(--opacity,.5)}footer{padding:12px 20px;color:#58708f;font-size:12px}
.gallery{max-width:1440px;margin:0 auto;padding:28px 24px 48px}.gallery-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px}.gallery h1{font-size:28px;margin:0}.gallery-heading p{color:#58708f;margin:0}.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.gallery-card{display:block;padding:0;overflow:hidden;background:white;border:1px solid #c9d8ed;border-radius:8px}.gallery-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;border-bottom:1px solid #dce8f6}.gallery-card div{padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.gallery-card b{font-size:18px}.gallery-card span{color:#586c8c}.gallery-card:hover{border-color:#0866ff}.gallery-card:focus-visible{outline:3px solid #0866ff;outline-offset:3px}@media(max-width:700px){.gallery-grid{grid-template-columns:1fr}.gallery-heading{display:block}.gallery-heading p{margin-top:8px}.gallery{padding:20px 14px}}body.overview header>select,body.overview header>button,body.overview header>label,body.overview #open,body.overview main,body.overview footer{display:none}body.overview header .note{margin-left:auto}</style><header><strong>Cloud Plan · 本机预览</strong><a href="/review?view=all">全部页面</a><select id="screen" aria-label="预览页面"><option value="daily">每日计划</option><option value="list">项目列表</option><option value="quadrants">四象限</option><option value="timeline">时间轴</option><option value="habits">21天习惯</option><option value="history">工作记录</option><option value="settings">设置与备份</option><option value="welcome">欢迎页</option></select><button data-mode="actual" aria-pressed="true">实际界面</button><button data-mode="concept" aria-pressed="false">概念图</button><button data-mode="overlay" aria-pressed="false">叠加对照</button><label id="opacity-label" hidden>概念图透明度<input type="range" min="0" max="100" value="50" id="opacity"></label><a id="open" target="_blank" rel="noopener">原尺寸打开 ↗</a><span class="note">独立演示数据 · 当前修改尚未发布 Site</span></header><section id="gallery" class="gallery" hidden></section><main><div class="frame" id="frame"><iframe id="app" title="可交互的本机界面"></iframe><img id="concept" alt="已批准的概念图"></div></main><footer>可在实际界面中操作；改动仅保存在本机预览进程的内存中。对照按相同宽度缩放，任务数量和日期由演示数据决定。</footer><script>
const ids=['daily','list','quadrants','timeline','habits','history','settings','welcome'],names=['01-daily','02-project-list','03-quadrants','04-timeline','05-habits','06-work-records','07-settings','08-welcome'];const frame=document.querySelector('#frame'),app=document.querySelector('#app'),concept=document.querySelector('#concept'),screen=document.querySelector('#screen');
function layout(){const scale=Math.min(1,(innerWidth-36)/1440);frame.style.width='1440px';frame.style.transform=`scale(${scale})`;frame.parentElement.style.height=`${1100*scale+36}px`;frame.style.marginLeft=`${Math.max(0,(innerWidth-36-1440)/2)}px`;}
function show(){app.src='/?screen='+screen.value;concept.src='/__concept/'+names[ids.indexOf(screen.value)];document.querySelector('#open').href=app.src;}
screen.onchange=show;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{frame.className='frame '+b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#opacity-label').hidden=b.dataset.mode!=='overlay';});document.querySelector('#opacity').oninput=e=>frame.style.setProperty('--opacity',e.target.value/100);addEventListener('resize',layout);const initial=new URLSearchParams(location.search).get('screen');if(ids.includes(initial))screen.value=initial;if(new URLSearchParams(location.search).get('view')==='all'){
 document.body.classList.add('overview');const gallery=document.querySelector('#gallery');gallery.hidden=false;
 const labels=['每日计划','项目列表','四象限','时间轴','21 天习惯','工作记录','设置与备份','欢迎与解锁'];
 gallery.innerHTML='<div class="gallery-heading"><h1>Cloud Plan · 整体效果</h1><p>8 页整体细化 · 待本机复核 · 尚未发布 Site</p></div><div class="gallery-grid">'+ids.map((id,i)=>'<a class="gallery-card" href="/review?screen='+id+'"><img src="/ui-review-preview/'+id+'.png" alt="'+labels[i]+'实际界面" loading="lazy"><div><b>'+labels[i]+'</b><span>查看完整页面 ↗</span></div></a>').join('')+'</div>';
}else{show();layout();}
</script></html>
